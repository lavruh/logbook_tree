name: logbook_tree
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.8+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  yaml_edit: ^2.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.5
  yaml: ^3.1.3
  intl: ^0.20.3
  sembast: ^3.8.9+1
  docx_to_text: ^1.0.1
  langchain: ^0.8.1
  langchain_community: ^0.4.0+2
  langchain_ollama: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/query_template.txt
    - assets/chat_ollama_options.json

